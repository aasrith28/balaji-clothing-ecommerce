<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Balaji Clothing</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">Balaji <span>Clothing</span></a>
    </div>
  </nav>
  <div class="form-card">
    <h2 style="text-align:center;margin-bottom:1.5rem">Create Account</h2>
    <div id="alert"></div>
    <form id="reg-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required minlength="2">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="phone">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:0.85rem">Sign Up</button>
    </form>
    <p style="text-align:center;margin-top:1.25rem;font-size:0.9rem">
      Already have an account? <a href="/login" style="color:var(--secondary);font-weight:600">Login</a>
    </p>
  </div>
  <script src="/static/js/app.js"></script>
  <script>
    if (isLoggedIn()) location.href = '/';
    document.getElementById('reg-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      try {
        const data = await api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            password: document.getElementById('password').value
          })
        });
        setAuth(data.token, data.user);
        showToast('Account created!', 'success');
        location.href = '/';
      } catch(err) {
        alert.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>

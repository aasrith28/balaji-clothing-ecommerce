<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Balaji Clothing</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">Balaji <span>Clothing</span></a>
      <div class="nav-actions">
        <a href="/cart" class="cart-btn">🛒 Cart <span class="cart-count" id="cart-count">0</span></a>
      </div>
    </div>
  </nav>
  <section class="section">
    <div class="container">
      <h2 class="section-title">Checkout</h2>
      <div class="checkout-grid">
        <div>
          <div class="form-card" style="max-width:100%">
            <h3 style="margin-bottom:1.5rem">Shipping Information</h3>
            <div id="alert"></div>
            <form id="checkout-form">
              <div class="form-group"><label>Full Name *</label><input type="text" id="name" required></div>
              <div class="form-group"><label>Email *</label><input type="email" id="email" required></div>
              <div class="form-group"><label>Phone *</label><input type="tel" id="phone" required></div>
              <div class="form-group"><label>Address *</label><textarea id="address" rows="2" required></textarea></div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                <div class="form-group"><label>City *</label><input type="text" id="city" required></div>
                <div class="form-group"><label>State *</label><input type="text" id="state" required></div>
              </div>
              <div class="form-group"><label>Postal Code *</label><input type="text" id="postal" required></div>
              <div class="form-group">
                <label>Payment Method *</label>
                <select id="payment" required>
                  <option value="cod">Cash on Delivery</option>
                  <option value="mock_online">Online Payment (Demo)</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary" style="width:100%;padding:0.9rem">Place Order</button>
            </form>
          </div>
        </div>
        <div>
          <div class="cart-summary">
            <h3 style="margin-bottom:1rem">Order Summary</h3>
            <div id="summary-items">Loading...</div>
            <div id="summary-totals"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <script src="/static/js/app.js"></script>
  <script>
    if (!isLoggedIn()) location.href = '/login';
    const user = getUser();
    if (user) {
      document.getElementById('name').value = user.name || '';
      document.getElementById('email').value = user.email || '';
      document.getElementById('phone').value = user.phone || '';
    }
    async function loadSummary() {
      try {
        const cartData = await api('/cart');
        if (!cartData.cart.items.length) { location.href = '/cart'; return; }
        document.getElementById('summary-items').innerHTML = cartData.cart.items.map(i => `
          <div class="row" style="font-size:0.9rem">
            <span>${i.product.name} × ${i.quantity}</span>
            <span>${formatPrice(i.product.price * i.quantity)}</span>
          </div>`).join('');
        const ship = cartData.subtotal >= 999 ? 0 : 99;
        document.getElementById('summary-totals').innerHTML = `
          <div class="row"><span>Subtotal</span><span>${formatPrice(cartData.subtotal)}</span></div>
          <div class="row"><span>Shipping</span><span>${ship === 0 ? 'FREE' : formatPrice(ship)}</span></div>
          <div class="row total"><span>Total</span><span>${formatPrice(cartData.subtotal + ship)}</span></div>`;
      } catch(e) { document.getElementById('summary-items').innerHTML = 'Failed to load'; }
    }
    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      alert.innerHTML = '';
      const body = {
        customer_name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        city: document.getElementById('city').value,
        state: document.getElementById('state').value,
        postal_code: document.getElementById('postal').value,
        payment_method: document.getElementById('payment').value,
      };
      try {
        const res = await api('/checkout', { method: 'POST', body: JSON.stringify(body) });
        showToast('Order placed successfully!', 'success');
        location.href = '/orders?success=1&order=' + res.order.order_number;
      } catch(err) {
        alert.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
    loadSummary();
  </script>
</body>
</html>

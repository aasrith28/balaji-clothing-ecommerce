<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Balaji Clothing</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">Balaji <span>Clothing</span></a>
    </div>
  </nav>
  <div class="form-card">
    <h2 style="text-align:center;margin-bottom:1.5rem">Welcome Back</h2>
    <div id="alert"></div>
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:0.85rem">Login</button>
    </form>
    <p style="text-align:center;margin-top:1.25rem;font-size:0.9rem">
      Don't have an account? <a href="/register" style="color:var(--secondary);font-weight:600">Sign Up</a>
    </p>
    <div style="margin-top:1.5rem;padding:1rem;background:#f8f9fa;border-radius:8px;font-size:0.85rem">
      <strong>Demo Accounts:</strong><br>
      User: user@balaji.com / user123<br>
      Admin: admin@balaji.com / admin123
    </div>
  </div>
  <script src="/static/js/app.js"></script>
  <script>
    if (isLoggedIn()) location.href = '/';
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alert');
      try {
        const data = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        setAuth(data.token, data.user);
        showToast('Login successful!', 'success');
        location.href = data.user.role === 'admin' ? '/admin' : '/';
      } catch(err) {
        alert.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
